version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: [patch]
      astro-minor:
        patterns: ["astro", "@astrojs/*"]
        update-types: [minor]
      tailwind-minor:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: [minor]
      other-minor:
        patterns: ["*"]
        update-types: [minor]
    # Major updates remain individual PRs for manual review.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/Madrid
    groups:
      actions-patches:
        patterns: ["*"]
        update-types: [patch]
      actions-minor:
        patterns: ["*"]
        update-types: [minor]
